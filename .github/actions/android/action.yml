name: Android
description: Build Android APK
runs:
  using: "composite"
  steps:
    - uses: Swatinem/rust-cache@v2
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - uses: android-actions/setup-android@v3

    - name: Install Android NDK
      shell: bash
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "ndk;27.0.12077973"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

    - name: Install cargo-apk
      shell: bash
      run: cargo install cargo-apk --locked

    - name: Generate throwaway release keystore
      shell: bash
      # Unlike the `dev` profile, cargo-apk never auto-generates a keystore
      # for `--release`, so building with it fails without one. This is a
      # disposable per-run signing key (not a real release identity) - it
      # only needs to make the APK installable, not Play Store ready.
      run: |
        keystore="$RUNNER_TEMP/android-release.keystore"
        keytool -genkeypair -v -keystore "$keystore" -alias androidreleasekey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass neothesia-ci -keypass neothesia-ci \
          -dname "CN=Neothesia CI, OU=CI, O=Neothesia, C=US"
        echo "CARGO_APK_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
        echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=neothesia-ci" >> "$GITHUB_ENV"

    - name: Build APK
      shell: bash
      working-directory: neothesia
      # `--lib` is required: the package also has a `[[bin]]` target (used on
      # desktop), and without it cargo-apk's artifact auto-selection picks
      # that bin instead of the `cdylib` lib Android needs, and panics.
      #
      # `--release` + `strip = "default"` (in Cargo.toml) keep the APK from
      # ballooning to hundreds of MB with unoptimized code and debug symbols.
      # It's signed with the throwaway keystore generated above, so it's
      # sideload-only, not Play Store ready.
      run: cargo apk build --lib --release

    - name: Collect APK
      shell: bash
      run: |
        apk_path=$(find . -name "*.apk" -path "*/apk/*" | head -n1)
        if [ -z "$apk_path" ]; then
          echo "No .apk file found under target/" >&2
          exit 1
        fi
        echo "Found APK: $apk_path"
        cp "$apk_path" neothesia-android.apk

    - uses: actions/upload-artifact@v6
      with:
        name: android-artifact
        path: neothesia-android.apk
