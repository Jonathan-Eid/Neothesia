name: Android
description: Build Android APK
runs:
  using: "composite"
  steps:
    - uses: Swatinem/rust-cache@v2
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - uses: android-actions/setup-android@v3

    - name: Install Android NDK
      shell: bash
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "ndk;27.0.12077973"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --locked

    - name: Build Rust cdylib (aarch64)
      shell: bash
      # `--lib` selects the `cdylib` target: the package also has a `[[bin]]`
      # (used on desktop) that cargo-ndk would otherwise try to build too.
      # Output goes straight into the Gradle project's jniLibs dir.
      #
      # --platform must be >= minSdk (26): cpal's Android backend links
      # against libaaudio.so, which only exists in the NDK sysroot for API
      # levels >= 26 (AAudio didn't exist before that).
      run: |
        cargo ndk \
          -t arm64-v8a \
          -o android/app/src/main/jniLibs \
          --platform 26 \
          build --release --lib -p neothesia

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.7"

    - name: Build APK with Gradle
      shell: bash
      working-directory: android
      run: gradle assembleRelease

    - name: Collect APK
      shell: bash
      run: |
        apk_path=$(find android/app/build/outputs/apk -name "*.apk" | head -n1)
        if [ -z "$apk_path" ]; then
          echo "No .apk file found under android/app/build/outputs/apk" >&2
          exit 1
        fi
        echo "Found APK: $apk_path"
        cp "$apk_path" neothesia-android.apk

    - uses: actions/upload-artifact@v6
      with:
        name: android-artifact
        path: neothesia-android.apk
