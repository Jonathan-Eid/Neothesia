name: Android Emulator Smoke Test
description: Build a debug x86_64 APK and boot-test it in a headless emulator
runs:
  using: "composite"
  steps:
    - uses: Swatinem/rust-cache@v2
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-linux-android

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - uses: android-actions/setup-android@v3

    - name: Install Android NDK
      shell: bash
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "ndk;27.0.12077973"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --locked

    # x86_64 (not aarch64) so it runs at full speed in a GitHub-hosted
    # emulator; debug (not release) since this build is thrown away, not
    # shipped. This is only ever meant to catch a startup crash/regression,
    # not to represent what a user's arm64 release build looks like.
    - name: Build Rust cdylib (x86_64, debug)
      shell: bash
      # --platform must be >= minSdk (26): cpal's Android backend links
      # against libaaudio.so, which only exists in the NDK sysroot for API
      # levels >= 26 (AAudio didn't exist before that).
      run: |
        cargo ndk \
          -t x86_64 \
          -o android/app/src/main/jniLibs \
          --platform 26 \
          build --lib -p neothesia-android

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.7"

    - name: Build debug APK
      shell: bash
      working-directory: android
      run: gradle assembleDebug

    - name: Enable KVM for the emulator
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Boot emulator, install, launch, check for a crash
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        arch: x86_64
        target: default
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        # Each line of `script` runs as its own separate `sh -c` invocation
        # (not one shell session), so any multi-line control flow has to
        # live in its own script file, run here as a single line. Commands
        # run with the checkout root as cwd (paths above are relative to it).
        script: bash .github/actions/android-smoke-test/check.sh
